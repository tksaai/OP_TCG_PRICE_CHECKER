<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カード正規化候補レビュー</title>
  <style>
    body { margin: 0 auto; padding: 20px; max-width: 1600px; font-family: sans-serif; background: #f4f4f6; color: #222; }
    header { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0; }
    button { border: none; border-radius: 4px; padding: 9px 12px; background: #26384d; color: white; font-weight: bold; cursor: pointer; }
    button.secondary { background: #667085; }
    button.safe-action { background: #1f7a47; }
    input, select { padding: 8px; border: 1px solid #cfd4dc; border-radius: 4px; }
    #controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    #github-settings { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: #fff; border: 1px solid #dde2ea; border-radius: 6px; padding: 10px; margin-bottom: 16px; }
    #github-settings input { min-width: 280px; }
    #github-settings label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #344054; }
    #github-settings label input { min-width: 0; }
    #list { display: grid; gap: 14px; }
    .candidate { background: white; border: 1px solid #dde2ea; border-radius: 6px; padding: 12px; }
    .candidate.risk-high { border-color: #f0a0a0; }
    .candidate.risk-medium { border-color: #e8c76c; }
    .candidate-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .candidate-title { font-weight: bold; }
    .canonical-edit { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .canonical-edit input { min-width: 320px; flex: 1; }
    .meta { color: #667085; font-size: 12px; }
    .records { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
    .record { display: grid; grid-template-columns: 64px 1fr; gap: 8px; border: 1px solid #edf0f4; border-radius: 4px; padding: 8px; }
    .record.excluded { background: #fafbfc; }
    .record:not(.excluded) { border-color: #86b7a0; background: #f3fbf6; }
    .candidate.accepted .record.excluded { opacity: .42; }
    .record img { width: 64px; height: 90px; object-fit: contain; background: #f8fafc; }
    .record label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #344054; margin-bottom: 4px; }
    .shop { font-size: 12px; color: #475467; }
    .price { color: #c0392b; font-weight: bold; }
    .actions { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .actions button:disabled { opacity: .45; cursor: not-allowed; }
    .guidance { background: #fff8e6; border: 1px solid #f1d486; border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; line-height: 1.6; }
    .warnings { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 10px; }
    .warning { background: #fff3cd; color: #7a4d00; border: 1px solid #efd28a; border-radius: 999px; padding: 3px 8px; font-size: 12px; }
    .risk { display: inline-block; border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: bold; }
    .risk.risk-high { background: #fee4e2; color: #9b1c1c; }
    .risk.risk-medium { background: #fff3cd; color: #7a4d00; }
    .risk.risk-low { background: #e9f7ef; color: #246b3a; }
    .groups { margin-top: 8px; display: grid; gap: 6px; }
    .group { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: #eef6ee; border: 1px solid #cde6ce; border-radius: 4px; padding: 6px 8px; font-size: 12px; }
    #manual-builder { background: #fff; border: 1px solid #dde2ea; border-radius: 6px; padding: 12px; margin-bottom: 16px; }
    #manual-builder summary { cursor: pointer; font-size: 15px; font-weight: bold; }
    #manual-builder[open] summary { margin-bottom: 12px; }
    #manual-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    #manual-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; max-height: 420px; overflow-y: auto; }
    .manual-selected { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .pill { background: #eef2ff; color: #344054; border: 1px solid #c7d7fe; border-radius: 999px; padding: 4px 8px; font-size: 12px; }
    .accepted { border-color: #2e7d32; box-shadow: inset 4px 0 0 #2e7d32; }
    .rejected { opacity: .45; }
    #load-more { display: none; margin: 20px auto 0; }
    #github-status { font-size: 12px; color: #667085; }
    #review-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .dashboard-card { background: #fff; border: 1px solid #dde2ea; border-radius: 6px; padding: 10px 12px; }
    .dashboard-card strong { display: block; font-size: 22px; margin-bottom: 2px; }
    #batch-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .safe-badge, .registered-badge, .hold-reason { display: inline-block; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: bold; }
    .safe-badge { background: #e9f7ef; color: #176438; border: 1px solid #a8d7bb; }
    .registered-badge { background: #e8efff; color: #264c96; border: 1px solid #b9c9ef; }
    .hold-reason { background: #f2f4f7; color: #475467; border: 1px solid #d0d5dd; }
    .candidate.safe-candidate { border-color: #8bc7a3; }
    .candidate.registered-candidate { background: #f8fbff; }
    .registered-note { color: #264c96; font-size: 13px; font-weight: bold; }
    .empty-state { background: #fff; border: 1px dashed #b8c0cc; border-radius: 6px; padding: 28px 16px; text-align: center; color: #475467; }
    @media (max-width: 700px) {
      body { padding: 12px; }
      header { align-items: flex-start; }
      .records { grid-template-columns: 1fr; }
      #github-settings input, .canonical-edit input { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>カード正規化候補レビュー</h1>
    <button onclick="downloadAliases()">既存JSON込みで書き出し</button>
  </header>

  <div class="guidance">
    <strong>画像は参考情報です。</strong>
    店舗の公式サンプル画像と実物写真、撮影方法の違いでは類似度が下がります。
    開封状態・言語・大会や配布区分・付属品を先に確認してください。
    「安全候補」は3店舗一致・警告なし・価格差2倍以内・画像類似度80%以上をすべて満たします。
  </div>

  <div id="review-dashboard">
    <div class="dashboard-card"><strong id="safePendingCount">-</strong>未登録の安全候補</div>
    <div class="dashboard-card"><strong id="registeredCount">-</strong>既存の正規化グループ</div>
    <div class="dashboard-card"><strong id="acceptedCount">-</strong>今回の確定</div>
    <div class="dashboard-card"><strong id="outputCount">-</strong>出力する正規化グループ</div>
  </div>
  <div id="batch-actions">
    <button class="safe-action" onclick="acceptVisibleSafeCandidates()">表示中の安全候補を一括確定</button>
    <button class="secondary" onclick="resetVisibleDecisions()">表示中を未判断に戻す</button>
  </div>

  <div id="controls">
    <input id="search" placeholder="カード名・型番で検索" oninput="render()">
    <select id="minConfidence" onchange="render()">
      <option value="0">候補度すべて</option>
      <option value="70">70以上</option>
      <option value="80">80以上</option>
      <option value="90">90以上</option>
    </select>
    <select id="statusFilter" onchange="render()">
      <option value="all">すべて</option>
      <option value="pending">未判断</option>
      <option value="accepted">確定済み</option>
      <option value="rejected">除外</option>
    </select>
    <select id="riskFilter" onchange="render()">
      <option value="all">確認レベルすべて</option>
      <option value="high">要確認</option>
      <option value="medium">注意</option>
      <option value="low">低リスク</option>
    </select>
    <select id="reviewFilter" onchange="render()">
      <option value="safe-pending">未登録の安全候補</option>
      <option value="unregistered">未登録候補すべて</option>
      <option value="registered">登録済み</option>
      <option value="all">登録状態すべて</option>
    </select>
  </div>

  <div id="github-settings">
    <input id="githubToken" type="password" placeholder="GitHub token（Contents/Actions write）">
    <button onclick="saveGithubToken()">トークン保存</button>
    <button onclick="clearGithubToken()">削除</button>
    <label><input id="runWorkflowAfterSave" type="checkbox" checked>保存後に価格更新も実行</label>
    <button onclick="pushAliasesToGithub()">既存JSONへ追記して保存</button>
    <span id="github-status"></span>
  </div>

  <details id="manual-builder">
    <summary>候補外から手動で正規化を作成</summary>
    <div id="manual-controls">
      <input id="manualSearch" placeholder="カード名・型番で検索" oninput="renderManualResults()">
      <input id="manualName" placeholder="正規化後のカード名">
      <input id="manualId" placeholder="canonicalId 例: OP13-118_RED_COMIC">
      <button onclick="addManualGroup()">手動グループとして追加</button>
    </div>
    <div class="meta" id="manualSummary"></div>
    <div class="manual-selected" id="manualSelected"></div>
    <div id="manual-results"></div>
  </details>

  <div id="summary" class="meta"></div>
  <div id="list"></div>
  <button id="load-more" onclick="loadMore()">もっと表示</button>

  <script src="alias-review-utils.js"></script>
  <script>
    let candidates = [];
    let allRecords = [];
    let existingAliases = [];
    let registeredCandidateIds = new Set();
    let registeredCanonicalIds = new Set();
    let decisions = JSON.parse(localStorage.getItem('aliasReviewDecisions') || '{}');
    let customGroups = JSON.parse(localStorage.getItem('aliasReviewGroups') || '[]');
    let nameEdits = JSON.parse(localStorage.getItem('aliasReviewNames') || '{}');
    let manualSelectedKeys = new Set();
    let renderLimit = 100;
    const GITHUB_OWNER = 'tksaai';
    const GITHUB_REPO = 'OP_TCG_PRICE_CHECKER';
    const GITHUB_BRANCH = 'main';
    const GITHUB_ALIAS_PATH = 'data/card-aliases.json';
    const { candidateSafety, mergeAliasGroups } = globalThis.OPAliasReviewUtils;

    function refreshRegisteredIndexes() {
      registeredCandidateIds = new Set(existingAliases.map(group => group.candidateId).filter(Boolean));
      registeredCanonicalIds = new Set(existingAliases.map(group => group.canonicalId).filter(Boolean));
    }

    function isRegistered(candidate) {
      return registeredCandidateIds.has(candidate.candidateId)
        || registeredCanonicalIds.has(candidate.suggestedCanonicalId);
    }

    function persistDecisions() {
      localStorage.setItem('aliasReviewDecisions', JSON.stringify(decisions));
    }

    function normalizeDecision(candidate) {
      const current = decisions[candidate.candidateId];
      if (typeof current === 'object' && current) {
        return {
          status: current.status || 'pending',
          selectedSourceKeys: Array.isArray(current.selectedSourceKeys) ? [...new Set(current.selectedSourceKeys)] : []
        };
      }
      return {
        status: current || 'pending',
        selectedSourceKeys: []
      };
    }

    function yen(value) {
      return '¥' + Number(value || 0).toLocaleString();
    }

    function normalizeText(value) {
      return String(value || '').toLowerCase().normalize('NFKC');
    }

    function setDecision(candidateId, decision) {
      const candidate = candidates.find(item => item.candidateId === candidateId);
      if (candidate && isRegistered(candidate)) return setGithubStatus('この候補はcard-aliases.jsonに登録済みです');
      const current = candidate ? normalizeDecision(candidate) : { selectedSourceKeys: [] };
      if (decision === 'accepted' && new Set(current.selectedSourceKeys).size < 2) {
        return setGithubStatus('同一カードと確認した商品グループを2つ以上選択してください');
      }
      decisions[candidateId] = {
        status: decision,
        selectedSourceKeys: current.selectedSourceKeys
      };
      persistDecisions();
      render();
    }

    function acceptSafeCandidate(candidateId) {
      const candidate = candidates.find(item => item.candidateId === candidateId);
      if (!candidate || isRegistered(candidate)) return;
      const safety = candidateSafety(candidate);
      if (!safety.safe) return setGithubStatus(`安全条件を満たしません: ${safety.reasons.join('、')}`);
      decisions[candidateId] = {
        status: 'accepted',
        selectedSourceKeys: [...new Set(candidate.records.map(record => record.sourceKey))]
      };
      persistDecisions();
      setGithubStatus(`${candidate.modelCode} を確定しました`);
      render();
    }

    function getCanonicalName(candidate) {
      return nameEdits[candidate.candidateId] || candidate.canonicalName;
    }

    function setCanonicalName(candidateId, value) {
      nameEdits[candidateId] = value.trim();
      localStorage.setItem('aliasReviewNames', JSON.stringify(nameEdits));
    }

    function selectedRecords(candidate) {
      const decision = normalizeDecision(candidate);
      const selected = new Set(decision.selectedSourceKeys);
      return candidate.records.filter(record => selected.has(record.sourceKey));
    }

    function toAlias(candidate) {
      const records = selectedRecords(candidate);
      return {
        canonicalId: candidate.suggestedCanonicalId,
        canonicalName: getCanonicalName(candidate),
        modelNo: candidate.modelCode,
        normalizationSource: 'alias-review-ui',
        candidateId: candidate.candidateId,
        aliases: records.map(record => ({
          shopId: record.shopId,
          sourceKey: record.sourceKey,
          name: record.name,
          modelNo: record.modelNo
        }))
      };
    }

    function aliasFromRecords(candidate, records, groupId) {
      const suffix = groupId.split('_').pop();
      return {
        canonicalId: `${candidate.suggestedCanonicalId}_${suffix}`.replace(/[^a-zA-Z0-9_-]/g, '_'),
        canonicalName: getCanonicalName(candidate),
        modelNo: candidate.modelCode,
        normalizationSource: 'alias-review-ui-split',
        sourceCandidateId: candidate.candidateId,
        aliases: records.map(record => ({
          shopId: record.shopId,
          sourceKey: record.sourceKey,
          name: record.name,
          modelNo: record.modelNo
        }))
      };
    }

    function aliasFromManual(records) {
      const canonicalName = document.getElementById('manualName').value.trim();
      const canonicalId = document.getElementById('manualId').value.trim();
      const modelNo = records[0]?.modelCode || records[0]?.modelNo || '';
      return {
        canonicalId: canonicalId || `MANUAL_${Date.now()}`,
        canonicalName: canonicalName || records[0]?.name || '手動正規化カード',
        modelNo,
        aliases: records.map(record => ({
          shopId: record.shopId,
          sourceKey: record.sourceKey,
          name: record.name,
          modelNo: record.modelNo
        }))
      };
    }

    function groupsForCandidate(candidateId) {
      return customGroups.filter(group => group.candidateId === candidateId);
    }

    function addSelectedGroup(candidateId) {
      const candidate = candidates.find(item => item.candidateId === candidateId);
      if (!candidate) return;
      if (isRegistered(candidate)) return setGithubStatus('この候補は登録済みです');
      const records = selectedRecords(candidate);
      const sourceCount = new Set(records.map(record => record.sourceKey)).size;
      if (sourceCount < 2) return setGithubStatus('商品グループを2つ以上選択してください');

      const groupId = `${candidateId}_${Date.now()}`;
      customGroups.push({
        groupId,
        candidateId,
        alias: aliasFromRecords(candidate, records, groupId)
      });
      localStorage.setItem('aliasReviewGroups', JSON.stringify(customGroups));
      setGithubStatus(`${records.length}件を別グループとして追加しました`);
      render();
    }

    function removeGroup(groupId) {
      customGroups = customGroups.filter(group => group.groupId !== groupId);
      localStorage.setItem('aliasReviewGroups', JSON.stringify(customGroups));
      render();
    }

    function addManualGroup() {
      const selectedRecords = allRecords.filter(record => manualSelectedKeys.has(record.sourceKey));
      if (selectedRecords.length < 2) return setGithubStatus('手動グループは2件以上選択してください');

      const groupId = `manual_${Date.now()}`;
      customGroups.push({
        groupId,
        candidateId: 'manual',
        alias: aliasFromManual(selectedRecords)
      });
      localStorage.setItem('aliasReviewGroups', JSON.stringify(customGroups));
      manualSelectedKeys.clear();
      document.getElementById('manualName').value = '';
      document.getElementById('manualId').value = '';
      setGithubStatus(`${selectedRecords.length}件を手動グループとして追加しました`);
      renderManualResults();
      render();
    }

    function toggleManualRecord(sourceKey, checked) {
      if (checked) manualSelectedKeys.add(sourceKey);
      else manualSelectedKeys.delete(sourceKey);
      renderManualSelected();
    }

    function renderManualSelected() {
      const selectedRecords = allRecords.filter(record => manualSelectedKeys.has(record.sourceKey));
      document.getElementById('manualSelected').innerHTML = selectedRecords.map(record =>
        `<span class="pill">${record.shopName}: ${record.name}</span>`
      ).join('');
      document.getElementById('manualSummary').textContent = `選択中 ${selectedRecords.length}件`;
    }

    function renderManualResults() {
      const query = normalizeText(document.getElementById('manualSearch').value.trim());
      const container = document.getElementById('manual-results');
      const selected = manualSelectedKeys;
      const results = query
        ? allRecords.filter(record => normalizeText(`${record.name} ${record.modelNo} ${record.shopName}`).includes(query)).slice(0, 120)
        : [];

      container.innerHTML = results.map(record => `
        <div class="record ${selected.has(record.sourceKey) ? '' : 'excluded'}">
          <img loading="lazy" referrerpolicy="no-referrer" src="${record.imageUrl}">
          <div>
            <label>
              <input type="checkbox" ${selected.has(record.sourceKey) ? 'checked' : ''} onchange="toggleManualRecord('${record.sourceKey.replace(/'/g, "\\'")}', this.checked)">
              このカードを含める
            </label>
            <div class="shop">${record.shopName}</div>
            <div>${record.name}</div>
            <div class="meta">${record.modelNo}</div>
            <div class="price">${yen(record.latestPrice)}</div>
          </div>
        </div>
      `).join('');
      renderManualSelected();
    }

    function addRecordsFromCards(cards) {
      const seen = new Set(allRecords.map(record => record.sourceKey));
      cards.forEach(card => {
        Object.entries(card.pricesByShop || {}).forEach(([shopId, shop]) => {
          const sourceKey = `${shopId}:${card.key}`;
          if (seen.has(sourceKey)) return;
          seen.add(sourceKey);
          allRecords.push({
            shopId,
            shopName: shop.shopName || shopId,
            sourceKey,
            name: card.name,
            modelNo: card.modelNo,
            modelCode: card.modelNo,
            latestPrice: Number(shop.latestPrice || 0),
            imageUrl: shop.imageUrl || card.imageId || ''
          });
        });
      });
      allRecords.sort((a, b) => Number(b.latestPrice || 0) - Number(a.latestPrice || 0));
    }

    function getAcceptedAliases() {
      const candidateIdsWithCustomGroups = new Set(customGroups.map(group => group.candidateId));
      const aliases = customGroups.map(group => group.alias);
      const directAliases = candidates
        .filter(candidate => {
          const decision = normalizeDecision(candidate);
          return !candidateIdsWithCustomGroups.has(candidate.candidateId)
            && !isRegistered(candidate)
            && decision.status === 'accepted'
            && new Set(decision.selectedSourceKeys).size >= 2;
        })
        .map(toAlias);
      return [...aliases, ...directAliases];
    }

    function getOutputAliases(baseAliases = existingAliases) {
      return mergeAliasGroups(baseAliases, getAcceptedAliases());
    }

    function setGithubStatus(message) {
      document.getElementById('github-status').textContent = message;
    }

    function saveGithubToken() {
      const token = document.getElementById('githubToken').value.trim();
      if (!token) return setGithubStatus('トークンが空です');
      localStorage.setItem('githubTokenForAliasReview', token);
      document.getElementById('githubToken').value = '';
      setGithubStatus('トークンをこのブラウザに保存しました');
    }

    function clearGithubToken() {
      localStorage.removeItem('githubTokenForAliasReview');
      document.getElementById('githubToken').value = '';
      setGithubStatus('トークンを削除しました');
    }

    function utf8ToBase64(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = '';
      bytes.forEach(byte => binary += String.fromCharCode(byte));
      return btoa(binary);
    }

    function base64ToUtf8(value) {
      const binary = atob(String(value || '').replace(/\s/g, ''));
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function toggleRecord(candidateId, sourceKey, checked) {
      const candidate = candidates.find(item => item.candidateId === candidateId);
      if (!candidate) return;
      if (isRegistered(candidate)) return setGithubStatus('この候補は登録済みです');

      const decision = normalizeDecision(candidate);
      const selected = new Set(decision.selectedSourceKeys);
      if (checked) selected.add(sourceKey);
      else selected.delete(sourceKey);

      decisions[candidateId] = {
        status: decision.status,
        selectedSourceKeys: Array.from(selected)
      };
      persistDecisions();
      render();
    }

    function setAllRecords(candidateId, checked) {
      const candidate = candidates.find(item => item.candidateId === candidateId);
      if (!candidate) return;
      if (isRegistered(candidate)) return setGithubStatus('この候補は登録済みです');
      const decision = normalizeDecision(candidate);
      decisions[candidateId] = {
        status: decision.status,
        selectedSourceKeys: checked ? [...new Set(candidate.records.map(record => record.sourceKey))] : []
      };
      persistDecisions();
      render();
    }

    function riskFor(candidate) {
      return ['high', 'medium', 'low'].includes(candidate.riskLevel) ? candidate.riskLevel : 'low';
    }

    function riskLabel(level) {
      return { high: '要確認', medium: '注意', low: '低リスク' }[level] || '低リスク';
    }

    function imageSummary(candidate) {
      const stats = candidate.imageStats;
      if (!stats || !stats.pairCount) return '画像参考: 比較なし';
      return `画像参考: 最大 ${stats.max}% / 中央 ${stats.median}% / 最低 ${stats.min}%（${stats.pairCount}組、${stats.hashedRecords}/${stats.totalRecords}画像）`;
    }

    function downloadAliases() {
      const accepted = getAcceptedAliases();
      const output = getOutputAliases();
      const blob = new Blob([JSON.stringify(output, null, 2) + '\n'], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'card-aliases.json';
      link.click();
      URL.revokeObjectURL(link.href);
      setGithubStatus(`既存${existingAliases.length}件に今回${accepted.length}件を反映し、合計${output.length}件を書き出しました`);
    }

    async function pushAliasesToGithub() {
      const token = localStorage.getItem('githubTokenForAliasReview');
      if (!token) return setGithubStatus('先にGitHubトークンを保存してください');

      const accepted = getAcceptedAliases();
      if (!accepted.length) return setGithubStatus('今回の確定候補がありません');

      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_ALIAS_PATH}`;
      const headers = {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      };

      setGithubStatus('GitHubの現在ファイルを確認中...');
      const current = await fetch(`${url}?ref=${GITHUB_BRANCH}`, { headers });
      if (!current.ok) {
        const text = await current.text();
        return setGithubStatus(`取得に失敗しました: ${current.status} ${text.slice(0, 120)}`);
      }
      const currentJson = await current.json();
      let remoteAliases;
      try {
        remoteAliases = JSON.parse(base64ToUtf8(currentJson.content));
      } catch (error) {
        return setGithubStatus('GitHub上のcard-aliases.jsonを解析できませんでした');
      }
      const output = getOutputAliases(remoteAliases);

      setGithubStatus(`既存${remoteAliases.length}件へ今回${accepted.length}件を反映中...`);
      const body = {
        message: 'Update card alias mappings',
        content: utf8ToBase64(JSON.stringify(output, null, 2) + '\n'),
        sha: currentJson.sha,
        branch: GITHUB_BRANCH
      };
      const response = await fetch(url, {
        method: 'PUT',
        headers,
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const text = await response.text();
        return setGithubStatus(`保存に失敗しました: ${response.status} ${text.slice(0, 120)}`);
      }
      existingAliases = output;
      refreshRegisteredIndexes();
      customGroups = [];
      localStorage.setItem('aliasReviewGroups', JSON.stringify(customGroups));
      let workflowStatus = '';
      if (document.getElementById('runWorkflowAfterSave').checked) {
        const workflowUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/actions/workflows/update-prices.yml/dispatches`;
        const workflowResponse = await fetch(workflowUrl, {
          method: 'POST',
          headers,
          body: JSON.stringify({ ref: GITHUB_BRANCH })
        });
        workflowStatus = workflowResponse.ok
          ? '。価格更新ワークフローも開始しました'
          : `。JSONは保存済みですが、価格更新の開始に失敗しました（${workflowResponse.status}）`;
      }
      setGithubStatus(`GitHubへ合計${output.length}件を保存しました（今回${accepted.length}件）${workflowStatus}`);
      render();
    }

    function loadMore() {
      renderLimit += 100;
      render();
    }

    function getFilteredCandidates() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const minConfidence = Number(document.getElementById('minConfidence').value);
      const status = document.getElementById('statusFilter').value;
      const risk = document.getElementById('riskFilter').value;
      const review = document.getElementById('reviewFilter').value;

      return candidates.filter(candidate => {
        const decision = normalizeDecision(candidate);
        const text = JSON.stringify(candidate).toLowerCase();
        const safety = candidateSafety(candidate);
        const registered = isRegistered(candidate);
        const reviewMatch = review === 'all'
          || (review === 'safe-pending' && safety.safe && !registered && decision.status === 'pending')
          || (review === 'unregistered' && !registered)
          || (review === 'registered' && registered);
        return candidate.confidence >= minConfidence
          && (status === 'all' || status === decision.status)
          && (risk === 'all' || risk === riskFor(candidate))
          && reviewMatch
          && (!query || text.includes(query));
      });
    }

    function acceptVisibleSafeCandidates() {
      const targets = getFilteredCandidates().filter(candidate => candidateSafety(candidate).safe && !isRegistered(candidate));
      if (!targets.length) return setGithubStatus('表示中に未登録の安全候補がありません');
      targets.forEach(candidate => {
        decisions[candidate.candidateId] = {
          status: 'accepted',
          selectedSourceKeys: [...new Set(candidate.records.map(record => record.sourceKey))]
        };
      });
      persistDecisions();
      setGithubStatus(`${targets.length}件の安全候補を一括確定しました`);
      render();
    }

    function resetVisibleDecisions() {
      const targets = getFilteredCandidates().filter(candidate => !isRegistered(candidate));
      if (!targets.length) return setGithubStatus('未判断へ戻せる候補がありません');
      targets.forEach(candidate => {
        decisions[candidate.candidateId] = { status: 'pending', selectedSourceKeys: [] };
      });
      persistDecisions();
      setGithubStatus(`${targets.length}件を未判断へ戻しました`);
      render();
    }

    function updateDashboard() {
      const safePending = candidates.filter(candidate => candidateSafety(candidate).safe && !isRegistered(candidate)).length;
      const registered = existingAliases.length;
      const accepted = candidates.filter(candidate => !isRegistered(candidate) && normalizeDecision(candidate).status === 'accepted').length
        + customGroups.length;
      document.getElementById('safePendingCount').textContent = safePending;
      document.getElementById('registeredCount').textContent = registered;
      document.getElementById('acceptedCount').textContent = accepted;
      document.getElementById('outputCount').textContent = getOutputAliases().length;
    }

    function render() {
      const list = document.getElementById('list');
      const loadMoreButton = document.getElementById('load-more');

      const filtered = getFilteredCandidates();
      updateDashboard();

      document.getElementById('summary').textContent =
        `${Math.min(filtered.length, renderLimit)} / ${filtered.length}件を表示中。全候補: ${candidates.length}件。既存JSON: ${existingAliases.length}件。別グループ: ${customGroups.length}件`;
      loadMoreButton.style.display = filtered.length > renderLimit ? 'block' : 'none';

      list.innerHTML = filtered.slice(0, renderLimit).map(candidate => {
        const decision = normalizeDecision(candidate);
        const registered = isRegistered(candidate);
        const safety = candidateSafety(candidate);
        const selected = registered
          ? new Set(candidate.records.map(record => record.sourceKey))
          : new Set(decision.selectedSourceKeys);
        const selectedCount = candidate.records.filter(record => selected.has(record.sourceKey)).length;
        const selectedSourceCount = new Set(
          candidate.records.filter(record => selected.has(record.sourceKey)).map(record => record.sourceKey)
        ).size;
        const riskLevel = riskFor(candidate);
        const priceRatio = candidate.priceStats?.ratio;
        return `
          <section class="candidate risk-${riskLevel} ${safety.safe ? 'safe-candidate' : ''} ${registered ? 'registered-candidate' : ''} ${decision.status === 'accepted' ? 'accepted' : ''} ${decision.status === 'rejected' ? 'rejected' : ''}">
            <div class="candidate-head">
              <div>
                <div class="candidate-title">
                  ${getCanonicalName(candidate)}
                  ${safety.safe ? '<span class="safe-badge">安全候補</span>' : ''}
                  ${registered ? '<span class="registered-badge">登録済み</span>' : ''}
                </div>
                <div class="meta">
                  ${candidate.modelCode} / ${candidate.signature} /
                  <span class="risk risk-${riskLevel}">${riskLabel(riskLevel)}</span> /
                  候補度 ${candidate.candidateScore ?? candidate.confidence} / 名前 ${candidate.nameScore ?? '-'}% /
                  ${imageSummary(candidate)}${priceRatio ? ` / 価格差 約${priceRatio}倍` : ''} / 選択 ${selectedSourceCount}グループ（${selectedCount}件）
                </div>
              </div>
              <div class="price">${yen(candidate.maxPrice)}</div>
            </div>
            <div class="warnings">
              ${(candidate.warnings || []).map(warning => `<span class="warning">${warning}</span>`).join('')}
              ${safety.safe ? '' : safety.reasons.map(reason => `<span class="hold-reason">保留: ${reason}</span>`).join('')}
            </div>
            <div class="canonical-edit">
              <input value="${getCanonicalName(candidate).replace(/"/g, '&quot;')}" oninput="setCanonicalName('${candidate.candidateId}', this.value)" placeholder="正規化後のカード名" ${registered ? 'disabled' : ''}>
            </div>
            <div class="records">
              ${candidate.records.map(record => `
                <div class="record ${selected.has(record.sourceKey) ? '' : 'excluded'}">
                  <img loading="lazy" referrerpolicy="no-referrer" src="${record.imageUrl}">
                  <div>
                    <label>
                      <input type="checkbox" ${selected.has(record.sourceKey) ? 'checked' : ''} ${registered ? 'disabled' : ''} onchange="toggleRecord('${candidate.candidateId}', '${record.sourceKey.replace(/'/g, "\\'")}', this.checked)">
                      このカードを含める
                    </label>
                    <div class="shop">${record.shopName}</div>
                    <div>${record.name}</div>
                    <div class="meta">${record.modelNo}</div>
                    ${record.tags?.length ? `<div class="meta">属性: ${record.tags.join(' / ')}</div>` : ''}
                    <div class="price">${yen(record.latestPrice)}</div>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="actions">
              ${registered ? '<span class="registered-note">card-aliases.jsonへ登録済みです</span>' : `
                ${safety.safe ? `<button class="safe-action" onclick="acceptSafeCandidate('${candidate.candidateId}')">全店舗を1クリック確定</button>` : ''}
                <button onclick="setAllRecords('${candidate.candidateId}', true)">すべて選択</button>
                <button onclick="setAllRecords('${candidate.candidateId}', false)" ${selectedCount === 0 ? 'disabled' : ''}>選択解除</button>
                <button onclick="addSelectedGroup('${candidate.candidateId}')" ${selectedSourceCount < 2 ? 'disabled' : ''}>選択を別グループとして追加</button>
                <button onclick="setDecision('${candidate.candidateId}', 'accepted')" ${selectedSourceCount < 2 ? 'disabled' : ''}>選択したカードで確定</button>
                <button onclick="setDecision('${candidate.candidateId}', 'rejected')">別カードとして除外</button>
                <button onclick="setDecision('${candidate.candidateId}', 'pending')">未判断に戻す</button>
              `}
            </div>
            <div class="groups">
              ${groupsForCandidate(candidate.candidateId).map(group => `
                <div class="group">
                  <span>${group.alias.canonicalName} / ${group.alias.aliases.length}件</span>
                  <button onclick="removeGroup('${group.groupId}')">削除</button>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }).join('');
      if (!filtered.length) {
        const safeView = document.getElementById('reviewFilter').value === 'safe-pending';
        list.innerHTML = safeView
          ? '<div class="empty-state"><strong>未登録の安全候補はありません。</strong><br>安全条件を満たした候補は処理済みです。追加確認する場合は「未登録候補すべて」へ切り替えてください。</div>'
          : '<div class="empty-state"><strong>条件に一致する候補がありません。</strong><br>検索語またはフィルターを変更してください。</div>';
      }
    }

    Promise.all([
      fetch('data/alias-candidates.json').then(response => response.json()),
      fetch('data/cards.json').then(response => response.json()).catch(() => []),
      fetch('data/card-aliases.json').then(response => response.json()).catch(() => [])
    ])
      .then(([data, cards, aliases]) => {
        candidates = data;
        existingAliases = Array.isArray(aliases) ? aliases : [];
        refreshRegisteredIndexes();
        const currentCandidateIds = new Set(candidates.map(candidate => candidate.candidateId));
        decisions = Object.fromEntries(
          Object.entries(decisions).filter(([candidateId]) => currentCandidateIds.has(candidateId))
        );
        persistDecisions();
        allRecords = [];
        const seen = new Set();
        data.forEach(candidate => {
          candidate.records.forEach(record => {
            if (!seen.has(record.sourceKey)) {
              seen.add(record.sourceKey);
              allRecords.push({ ...record, modelCode: candidate.modelCode });
            }
          });
        });
        addRecordsFromCards(cards);
        if (localStorage.getItem('githubTokenForAliasReview')) {
          setGithubStatus(`保存済みトークンがあります。既存JSON ${existingAliases.length}件を読み込みました`);
        } else {
          setGithubStatus(`既存JSON ${existingAliases.length}件を読み込みました`);
        }
        renderManualResults();
        render();
      })
      .catch(() => {
        document.getElementById('summary').textContent = '候補データがありません。先に scripts/generate-alias-candidates.mjs を実行してください。';
      });
  </script>
</body>
</html>
