<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カード正規化候補レビュー</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; background: #f4f4f6; color: #222; }
    header { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0; }
    button { border: none; border-radius: 4px; padding: 9px 12px; background: #26384d; color: white; font-weight: bold; cursor: pointer; }
    input, select { padding: 8px; border: 1px solid #cfd4dc; border-radius: 4px; }
    #controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    #github-settings { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: #fff; border: 1px solid #dde2ea; border-radius: 6px; padding: 10px; margin-bottom: 16px; }
    #github-settings input { min-width: 280px; }
    #list { display: grid; gap: 14px; }
    .candidate { background: white; border: 1px solid #dde2ea; border-radius: 6px; padding: 12px; }
    .candidate-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .candidate-title { font-weight: bold; }
    .canonical-edit { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .canonical-edit input { min-width: 320px; flex: 1; }
    .meta { color: #667085; font-size: 12px; }
    .records { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
    .record { display: grid; grid-template-columns: 64px 1fr; gap: 8px; border: 1px solid #edf0f4; border-radius: 4px; padding: 8px; }
    .record.excluded { opacity: .42; }
    .record img { width: 64px; height: 90px; object-fit: contain; background: #f8fafc; }
    .record label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #344054; margin-bottom: 4px; }
    .shop { font-size: 12px; color: #475467; }
    .price { color: #c0392b; font-weight: bold; }
    .actions { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
    .groups { margin-top: 8px; display: grid; gap: 6px; }
    .group { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: #eef6ee; border: 1px solid #cde6ce; border-radius: 4px; padding: 6px 8px; font-size: 12px; }
    .accepted { border-color: #2e7d32; box-shadow: inset 4px 0 0 #2e7d32; }
    .rejected { opacity: .45; }
    #load-more { display: none; margin: 20px auto 0; }
    #github-status { font-size: 12px; color: #667085; }
  </style>
</head>
<body>
  <header>
    <h1>カード正規化候補レビュー</h1>
    <button onclick="downloadAliases()">確定JSONを書き出し</button>
  </header>

  <div id="controls">
    <input id="search" placeholder="カード名・型番で検索" oninput="render()">
    <select id="minConfidence" onchange="render()">
      <option value="0">信頼度すべて</option>
      <option value="70">70以上</option>
      <option value="80">80以上</option>
      <option value="90">90以上</option>
    </select>
    <select id="statusFilter" onchange="render()">
      <option value="all">すべて</option>
      <option value="pending">未判断</option>
      <option value="accepted">確定済み</option>
      <option value="rejected">除外</option>
    </select>
  </div>

  <div id="github-settings">
    <input id="githubToken" type="password" placeholder="GitHub fine-grained token">
    <button onclick="saveGithubToken()">トークン保存</button>
    <button onclick="clearGithubToken()">削除</button>
    <button onclick="pushAliasesToGithub()">GitHubへ保存</button>
    <span id="github-status"></span>
  </div>

  <div id="summary" class="meta"></div>
  <div id="list"></div>
  <button id="load-more" onclick="loadMore()">もっと表示</button>

  <script>
    let candidates = [];
    let decisions = JSON.parse(localStorage.getItem('aliasReviewDecisions') || '{}');
    let customGroups = JSON.parse(localStorage.getItem('aliasReviewGroups') || '[]');
    let nameEdits = JSON.parse(localStorage.getItem('aliasReviewNames') || '{}');
    let renderLimit = 100;
    const GITHUB_OWNER = 'tksaai';
    const GITHUB_REPO = 'OP_TCG_PRICE_CHECKER';
    const GITHUB_BRANCH = 'main';
    const GITHUB_ALIAS_PATH = 'data/card-aliases.json';

    function normalizeDecision(candidate) {
      const current = decisions[candidate.candidateId];
      if (typeof current === 'object' && current) {
        return {
          status: current.status || 'pending',
          selectedSourceKeys: current.selectedSourceKeys || candidate.records.map(record => record.sourceKey)
        };
      }
      return {
        status: current || 'pending',
        selectedSourceKeys: candidate.records.map(record => record.sourceKey)
      };
    }

    function yen(value) {
      return '¥' + Number(value || 0).toLocaleString();
    }

    function setDecision(candidateId, decision) {
      const candidate = candidates.find(item => item.candidateId === candidateId);
      const current = candidate ? normalizeDecision(candidate) : { selectedSourceKeys: [] };
      decisions[candidateId] = {
        status: decision,
        selectedSourceKeys: current.selectedSourceKeys
      };
      localStorage.setItem('aliasReviewDecisions', JSON.stringify(decisions));
      render();
    }

    function getCanonicalName(candidate) {
      return nameEdits[candidate.candidateId] || candidate.canonicalName;
    }

    function setCanonicalName(candidateId, value) {
      nameEdits[candidateId] = value.trim();
      localStorage.setItem('aliasReviewNames', JSON.stringify(nameEdits));
    }

    function selectedRecords(candidate) {
      const decision = normalizeDecision(candidate);
      const selected = new Set(decision.selectedSourceKeys);
      return candidate.records.filter(record => selected.has(record.sourceKey));
    }

    function toAlias(candidate) {
      const records = selectedRecords(candidate);
      return {
        canonicalId: candidate.suggestedCanonicalId,
        canonicalName: getCanonicalName(candidate),
        modelNo: candidate.modelCode,
        aliases: records.map(record => ({
          shopId: record.shopId,
          sourceKey: record.sourceKey,
          name: record.name,
          modelNo: record.modelNo
        }))
      };
    }

    function aliasFromRecords(candidate, records, groupId) {
      const suffix = groupId.split('_').pop();
      return {
        canonicalId: `${candidate.suggestedCanonicalId}_${suffix}`.replace(/[^a-zA-Z0-9_-]/g, '_'),
        canonicalName: getCanonicalName(candidate),
        modelNo: candidate.modelCode,
        aliases: records.map(record => ({
          shopId: record.shopId,
          sourceKey: record.sourceKey,
          name: record.name,
          modelNo: record.modelNo
        }))
      };
    }

    function groupsForCandidate(candidateId) {
      return customGroups.filter(group => group.candidateId === candidateId);
    }

    function addSelectedGroup(candidateId) {
      const candidate = candidates.find(item => item.candidateId === candidateId);
      if (!candidate) return;
      const records = selectedRecords(candidate);
      if (records.length < 2) return setGithubStatus('2件以上選択してください');

      const groupId = `${candidateId}_${Date.now()}`;
      customGroups.push({
        groupId,
        candidateId,
        alias: aliasFromRecords(candidate, records, groupId)
      });
      localStorage.setItem('aliasReviewGroups', JSON.stringify(customGroups));
      setGithubStatus(`${records.length}件を別グループとして追加しました`);
      render();
    }

    function removeGroup(groupId) {
      customGroups = customGroups.filter(group => group.groupId !== groupId);
      localStorage.setItem('aliasReviewGroups', JSON.stringify(customGroups));
      render();
    }

    function getAcceptedAliases() {
      const candidateIdsWithCustomGroups = new Set(customGroups.map(group => group.candidateId));
      const aliases = customGroups.map(group => group.alias);
      const directAliases = candidates
        .filter(candidate => {
          const decision = normalizeDecision(candidate);
          return !candidateIdsWithCustomGroups.has(candidate.candidateId)
            && decision.status === 'accepted'
            && decision.selectedSourceKeys.length >= 2;
        })
        .map(toAlias);
      return [...aliases, ...directAliases];
    }

    function setGithubStatus(message) {
      document.getElementById('github-status').textContent = message;
    }

    function saveGithubToken() {
      const token = document.getElementById('githubToken').value.trim();
      if (!token) return setGithubStatus('トークンが空です');
      localStorage.setItem('githubTokenForAliasReview', token);
      document.getElementById('githubToken').value = '';
      setGithubStatus('トークンをこのブラウザに保存しました');
    }

    function clearGithubToken() {
      localStorage.removeItem('githubTokenForAliasReview');
      document.getElementById('githubToken').value = '';
      setGithubStatus('トークンを削除しました');
    }

    function utf8ToBase64(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = '';
      bytes.forEach(byte => binary += String.fromCharCode(byte));
      return btoa(binary);
    }

    function toggleRecord(candidateId, sourceKey, checked) {
      const candidate = candidates.find(item => item.candidateId === candidateId);
      if (!candidate) return;

      const decision = normalizeDecision(candidate);
      const selected = new Set(decision.selectedSourceKeys);
      if (checked) selected.add(sourceKey);
      else selected.delete(sourceKey);

      decisions[candidateId] = {
        status: decision.status,
        selectedSourceKeys: Array.from(selected)
      };
      localStorage.setItem('aliasReviewDecisions', JSON.stringify(decisions));
      render();
    }

    function downloadAliases() {
      const accepted = getAcceptedAliases();
      const blob = new Blob([JSON.stringify(accepted, null, 2) + '\n'], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'card-aliases.json';
      link.click();
      URL.revokeObjectURL(link.href);
    }

    async function pushAliasesToGithub() {
      const token = localStorage.getItem('githubTokenForAliasReview');
      if (!token) return setGithubStatus('先にGitHubトークンを保存してください');

      const accepted = getAcceptedAliases();
      if (!accepted.length) return setGithubStatus('確定済み候補がありません');

      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_ALIAS_PATH}`;
      const headers = {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      };

      setGithubStatus('GitHubの現在ファイルを確認中...');
      const current = await fetch(`${url}?ref=${GITHUB_BRANCH}`, { headers });
      if (!current.ok) {
        const text = await current.text();
        return setGithubStatus(`取得に失敗しました: ${current.status} ${text.slice(0, 120)}`);
      }
      const currentJson = await current.json();

      setGithubStatus('GitHubへ保存中...');
      const body = {
        message: 'Update card alias mappings',
        content: utf8ToBase64(JSON.stringify(accepted, null, 2) + '\n'),
        sha: currentJson.sha,
        branch: GITHUB_BRANCH
      };
      const response = await fetch(url, {
        method: 'PUT',
        headers,
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const text = await response.text();
        return setGithubStatus(`保存に失敗しました: ${response.status} ${text.slice(0, 120)}`);
      }
      setGithubStatus(`${accepted.length}件をGitHubへ保存しました`);
    }

    function loadMore() {
      renderLimit += 100;
      render();
    }

    function render() {
      const query = document.getElementById('search').value.trim().toLowerCase();
      const minConfidence = Number(document.getElementById('minConfidence').value);
      const status = document.getElementById('statusFilter').value;
      const list = document.getElementById('list');
      const loadMoreButton = document.getElementById('load-more');

      const filtered = candidates.filter(candidate => {
        const decision = normalizeDecision(candidate);
        const text = JSON.stringify(candidate).toLowerCase();
        return candidate.confidence >= minConfidence
          && (status === 'all' || status === decision.status)
          && (!query || text.includes(query));
      });

      document.getElementById('summary').textContent =
        `${Math.min(filtered.length, renderLimit)} / ${filtered.length}件を表示中。全候補: ${candidates.length}件。確定済み: ${Object.values(decisions).filter(v => (typeof v === 'object' ? v.status : v) === 'accepted').length}件。別グループ: ${customGroups.length}件`;
      loadMoreButton.style.display = filtered.length > renderLimit ? 'block' : 'none';

      list.innerHTML = filtered.slice(0, renderLimit).map(candidate => {
        const decision = normalizeDecision(candidate);
        const selected = new Set(decision.selectedSourceKeys);
        const selectedCount = candidate.records.filter(record => selected.has(record.sourceKey)).length;
        return `
          <section class="candidate ${decision.status === 'accepted' ? 'accepted' : ''} ${decision.status === 'rejected' ? 'rejected' : ''}">
            <div class="candidate-head">
              <div>
                <div class="candidate-title">${getCanonicalName(candidate)}</div>
                <div class="meta">${candidate.modelCode} / ${candidate.signature} / 信頼度 ${candidate.confidence} / 選択 ${selectedCount}件</div>
              </div>
              <div class="price">${yen(candidate.maxPrice)}</div>
            </div>
            <div class="canonical-edit">
              <input value="${getCanonicalName(candidate).replace(/"/g, '&quot;')}" oninput="setCanonicalName('${candidate.candidateId}', this.value)" placeholder="正規化後のカード名">
            </div>
            <div class="records">
              ${candidate.records.map(record => `
                <div class="record ${selected.has(record.sourceKey) ? '' : 'excluded'}">
                  <img loading="lazy" referrerpolicy="no-referrer" src="${record.imageUrl}">
                  <div>
                    <label>
                      <input type="checkbox" ${selected.has(record.sourceKey) ? 'checked' : ''} onchange="toggleRecord('${candidate.candidateId}', '${record.sourceKey.replace(/'/g, "\\'")}', this.checked)">
                      このカードを含める
                    </label>
                    <div class="shop">${record.shopName}</div>
                    <div>${record.name}</div>
                    <div class="meta">${record.modelNo}</div>
                    <div class="price">${yen(record.latestPrice)}</div>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="actions">
              <button onclick="addSelectedGroup('${candidate.candidateId}')" ${selectedCount < 2 ? 'disabled' : ''}>選択を別グループとして追加</button>
              <button onclick="setDecision('${candidate.candidateId}', 'accepted')" ${selectedCount < 2 ? 'disabled' : ''}>選択したカードで確定</button>
              <button onclick="setDecision('${candidate.candidateId}', 'rejected')">別カードとして除外</button>
              <button onclick="setDecision('${candidate.candidateId}', 'pending')">未判断に戻す</button>
            </div>
            <div class="groups">
              ${groupsForCandidate(candidate.candidateId).map(group => `
                <div class="group">
                  <span>${group.alias.canonicalName} / ${group.alias.aliases.length}件</span>
                  <button onclick="removeGroup('${group.groupId}')">削除</button>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }).join('');
    }

    fetch('data/alias-candidates.json')
      .then(response => response.json())
      .then(data => {
        candidates = data;
        if (localStorage.getItem('githubTokenForAliasReview')) {
          setGithubStatus('保存済みトークンがあります');
        }
        render();
      })
      .catch(() => {
        document.getElementById('summary').textContent = '候補データがありません。先に scripts/generate-alias-candidates.mjs を実行してください。';
      });
  </script>
</body>
</html>
