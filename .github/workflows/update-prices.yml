name: Update card prices

on:
  workflow_dispatch:
  schedule:
    - cron: '10 6 * * *'
    - cron: '10 18 * * *'

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scrape prices
        run: node scripts/scrape-prices.mjs
      - name: Apply card aliases
        run: node scripts/apply-card-aliases.mjs
      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update card prices
          file_pattern: data/cards.json
