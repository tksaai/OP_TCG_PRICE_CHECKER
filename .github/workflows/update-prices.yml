name: Update card prices

on:
  workflow_dispatch:
  schedule:
    - cron: '10 6 * * *'
    - cron: '10 18 * * *'

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test search utilities
        run: node scripts/test-search-filters.mjs
      - name: Test alias candidate safety
        run: node scripts/test-alias-candidates.mjs
      - name: Scrape prices
        run: node scripts/scrape-prices.mjs
      - name: Apply card aliases
        run: node scripts/apply-card-aliases.mjs
      - name: Sync OP_TCG_DB card details
        continue-on-error: true
        run: node scripts/sync-card-details.mjs
      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update card prices
          file_pattern: data/cards.json data/card-details.json
