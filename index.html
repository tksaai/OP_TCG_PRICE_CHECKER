<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワンピカード 資産管理</title>
  
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/one-piece.png">
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/96/one-piece.png">
  <meta name="apple-mobile-web-app-title" content="ワンピ資産">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; margin: 0; }
    
    #asset-summary { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .asset-info-row { display: flex; gap: 20px; align-items: center; justify-content: space-around; flex-wrap: wrap;}
    .asset-item { text-align: center; }
    .asset-label { font-size: 0.8em; opacity: 0.8; }
    .asset-value { font-size: 1.5em; font-weight: bold; color: #f1c40f; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .btn-export { background-color: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; }
    .btn-import { background-color: #2980b9; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; }

    #total-asset-chart-container { background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 6px; height: 180px; width: 100%; cursor: pointer;}
    #asset-breakdown { display: none; background: #fff; color: #333; margin-top: 10px; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-height: 250px; overflow-y: auto; font-size: 0.9em;}

    #controls { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    #controls input, #controls select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; flex: 1; min-width: 150px; }
    
    #series-filters { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 20px; }
    .series-btn { padding: 6px 12px; border: 1px solid #ccc; border-radius: 20px; background: white; cursor: pointer; font-size: 0.8em; transition: 0.2s; }
    .series-btn.active { background: #007bff; color: white; border-color: #007bff; font-weight: bold; }
    
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; text-align: center; transition: 0.2s; display: flex; flex-direction: column; position: relative;}
    .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    .card img { max-width: 100%; height: auto; border-radius: 4px; margin-bottom: 8px; }
    
    .price-main { font-weight: bold; color: #d9534f; font-size: 1.4em; margin: 5px 0; }
    .shop-badge { display: inline-block; font-size: 0.72em; color: #fff; background: #34495e; border-radius: 4px; padding: 3px 7px; margin-bottom: 4px; }
    .shop-compare { font-size: 0.75em; color: #555; background: #f8f9fb; border: 1px solid #e0e4e8; border-radius: 4px; padding: 6px; margin: 6px 0; text-align: left; }
    .shop-compare div { display: flex; justify-content: space-between; gap: 8px; }
    #load-more { display: none; margin: 24px auto 0; padding: 10px 18px; border: none; border-radius: 4px; background: #2c3e50; color: #fff; font-weight: bold; cursor: pointer; }
    .inventory-control { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #eee; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .inventory-input { width: 50px; padding: 4px; border: 1px solid #ddd; border-radius: 4px; text-align: center; font-weight: bold; }

    .trend-container { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
    .trend { font-size: 0.75em; font-weight: bold; padding: 4px; border-radius: 4px; background: #f9f9f9; text-align: left; display: flex; justify-content: space-between;}
    .trend span.label { color: #555; }
    .trend.up { background: #ffebee; color: #e53935; }
    .trend.down { background: #e3f2fd; color: #1e88e5; }
    .trend.flat { color: #9e9e9e; }
    
    .price-range { display: flex; justify-content: space-around; font-size: 0.75em; color: #666; background: #f0f2f5; padding: 6px; border-radius: 4px; margin-top: auto; border: 1px solid #e0e4e8; }
    .price-min { color: #1e88e5; font-weight: bold; }
    .price-max { color: #d32f2f; font-weight: bold; }

    .star-btn { position: absolute; top: 10px; right: 10px; font-size: 24px; color: #ccc; cursor: pointer; text-shadow: 0 0 2px rgba(0,0,0,0.3); z-index: 10; transition: transform 0.1s;}
    .star-btn:hover { transform: scale(1.2); }
    .star-btn.active { color: #ffd700; text-shadow: 0 0 5px rgba(255, 215, 0, 0.8); }

    #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
    #modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 600px; position: relative; }
    #close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 24px; color: #666; }
    #loading { text-align: center; color: #666; padding: 50px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="asset-summary">
    <div class="asset-info-row">
      <div class="asset-item">
        <div class="asset-label">合計枚数</div>
        <div id="total-count" class="asset-value">0 枚</div>
      </div>
      <div class="asset-item">
        <div class="asset-label">推定資産総額</div>
        <div id="total-assets" class="asset-value">¥0</div>
      </div>
      <div class="btn-group">
        <button class="btn-export" onclick="exportToCSV()">CSV保存</button>
        <button class="btn-import" onclick="document.getElementById('csvInput').click()">CSV読込</button>
        <input type="file" id="csvInput" style="display:none" accept=".csv" onchange="importFromCSV(event)">
      </div>
    </div>
    <div id="total-asset-chart-container">
      <canvas id="totalAssetChart"></canvas>
    </div>
    <div id="asset-breakdown"></div>
  </div>
  
  <div id="controls">
    <input type="text" id="searchInput" placeholder="カード名や型番で検索..." oninput="filterAndRender()">
    <select id="shopFilter" onchange="setShop(this.value)">
      <option value="best">ショップ最高買取</option>
      <option value="mercard">メルカード</option>
      <option value="cardrush">カードラッシュ</option>
      <option value="torecard">トレカード秋葉原</option>
    </select>
    <select id="trendFilter" onchange="filterAndRender()">
      <option value="all">すべてのカード</option>
      <option value="owned">📦 所持カードのみ</option>
      <option value="favorites">⭐ お気に入りのみ</option>
      <option value="allTimeHigh">👑 過去最高額を更新中</option>
      <option value="dailyUp">📈 前日から上がったカード</option>
      <option value="dailyDown">📉 前日から下がったカード</option>
      <option value="weeklyUp">📅 1週間で上がったカード</option>
      <option value="weeklyDown">📅 1週間で下がったカード</option>
      <option value="surge">🔥 爆益中 (+5%以上)</option>
      <option value="crash">🥶 暴落中 (-5%以下)</option>
      <option value="high">💎 10万円以上の高額</option>
    </select>
    <select id="sortOrder" onchange="filterAndRender()">
      <option value="priceDesc">高い順（価格）</option>
      <option value="priceAsc">安い順（価格）</option>
      <option value="trendDesc">↑ 前日からの値上がり額順</option>
      <option value="trendAsc">↓ 前日からの値下がり額順</option>
      <option value="weeklyDesc">↑ 1週間の値上がり額順</option>
      <option value="weeklyAsc">↓ 1週間の値下がり額順</option>
      <option value="modelAsc">型番順 (OP01〜)</option>
    </select>
  </div>

  <div id="series-filters">
    <button class="series-btn active" onclick="setSeries('all', this)">すべて</button>
    <button class="series-btn" onclick="setSeries('OP', this)">通常弾(OP)</button>
    <button class="series-btn" onclick="setSeries('EB', this)">エクストラ(EB)</button>
    <button class="series-btn" onclick="setSeries('ST', this)">スタート(ST)</button>
    <button class="series-btn" onclick="setSeries('P-', this)">プロモ</button>
  </div>

  <div id="loading">データを読み込んでいます...</div>
  <div id="no-data-msg" style="display: none; text-align: center; color: gray; padding: 50px;">該当するカードがありません。</div>
  <div id="grid"></div>
  <button id="load-more" onclick="loadMoreCards()">もっと表示</button>

  <div id="modal">
    <div id="modal-content">
      <span id="close-btn" onclick="closeModal()">×</span>
      <h3 id="modal-title"></h3>
      <canvas id="priceChart"></canvas>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚠️ 設定
    // ==========================================
    const API_URL = 'data/cards.json';

    let chartInstance = null;
    let totalAssetChartInstance = null;
    let cardDataList = [];
    let currentSeries = 'all'; 
    let currentShop = 'best';
    let renderLimit = 300;

    let favorites = JSON.parse(localStorage.getItem('onepieceFavorites')) || [];
    let ownedCounts = JSON.parse(localStorage.getItem('onepieceOwnedCounts')) || {};

    function normalizeCardForShops(card) {
      if (!card.pricesByShop) {
        card.pricesByShop = {
          mercard: {
            shopName: 'メルカード',
            latestPrice: Number(card.latestPrice || 0),
            imageUrl: card.imageId || '',
            history: card.history || []
          }
        };
        card.bestShopId = 'mercard';
      }
      return card;
    }

    function getShopData(card) {
      if (currentShop !== 'best') return card.pricesByShop[currentShop] || null;
      return card.pricesByShop[card.bestShopId] || Object.values(card.pricesByShop).sort((a, b) => b.latestPrice - a.latestPrice)[0] || null;
    }

    function getActivePrice(card) {
      return Number(getShopData(card)?.latestPrice || 0);
    }

    function getActiveHistory(card) {
      return getShopData(card)?.history || card.history || [];
    }

    function getActiveImage(card) {
      return getShopData(card)?.imageUrl || card.imageId || '';
    }

    function setShop(shopId) {
      currentShop = shopId;
      renderLimit = 300;
      prepareTrendData(cardDataList);
      refreshAssetStats();
      filterAndRender();
    }

    function legacyCardKey(card) {
      return card.name + "_" + card.modelNo;
    }

    function getCardKey(card) {
      return card.canonicalId || card.key || legacyCardKey(card);
    }

    function getAliasKeys(card) {
      return [...new Set([legacyCardKey(card), card.key, ...(card.aliasKeys || [])].filter(Boolean))];
    }

    function migrateSavedCardState(cards) {
      let inventoryChanged = false;
      let favoritesChanged = false;
      const favoriteSet = new Set(favorites);

      cards.forEach(card => {
        const canonicalKey = getCardKey(card);
        const aliasKeys = getAliasKeys(card).filter(key => key !== canonicalKey);
        let migratedCount = ownedCounts[canonicalKey] || 0;

        aliasKeys.forEach(aliasKey => {
          if (ownedCounts[aliasKey]) {
            migratedCount += Number(ownedCounts[aliasKey] || 0);
            delete ownedCounts[aliasKey];
            inventoryChanged = true;
          }
          if (favoriteSet.has(aliasKey)) {
            favoriteSet.add(canonicalKey);
            favoriteSet.delete(aliasKey);
            favoritesChanged = true;
          }
        });

        if (migratedCount !== (ownedCounts[canonicalKey] || 0)) {
          ownedCounts[canonicalKey] = migratedCount;
          inventoryChanged = true;
        }
      });

      if (inventoryChanged) localStorage.setItem('onepieceOwnedCounts', JSON.stringify(ownedCounts));
      if (favoritesChanged) {
        favorites = Array.from(favoriteSet);
        localStorage.setItem('onepieceFavorites', JSON.stringify(favorites));
      }
    }

    function updateInventory(event, key) {
      event.stopPropagation();
      const count = parseInt(event.target.value) || 0;
      ownedCounts[key] = count < 0 ? 0 : count;
      localStorage.setItem('onepieceOwnedCounts', JSON.stringify(ownedCounts));
      refreshAssetStats();
    }

    function refreshAssetStats() {
      calculateTotalAssets();
      renderTotalAssetChart();
      document.getElementById('asset-breakdown').style.display = 'none';
    }

    function calculateTotalAssets() {
      let totalValue = 0;
      let totalCards = 0;
      cardDataList.forEach(card => {
        const key = getCardKey(card);
        const count = ownedCounts[key] || 0;
        totalCards += count;
        totalValue += (getActivePrice(card) * count);
      });
      document.getElementById('total-count').innerText = totalCards.toLocaleString() + ' 枚';
      document.getElementById('total-assets').innerText = '¥' + totalValue.toLocaleString();
    }

    function renderTotalAssetChart() {
      const allDates = new Set();
      cardDataList.forEach(card => getActiveHistory(card).forEach(h => allDates.add(h.date)));
      const sortedDates = Array.from(allDates).sort((a, b) => new Date(a) - new Date(b));

      const trendData = sortedDates.map(date => {
        let dailyTotal = 0;
        cardDataList.forEach(card => {
          const count = ownedCounts[getCardKey(card)] || 0;
          if (count > 0) {
            const priceRecord = getActiveHistory(card)
              .filter(h => new Date(h.date) <= new Date(date))
              .sort((a, b) => new Date(b.date) - new Date(a.date))[0];
            if (priceRecord) dailyTotal += priceRecord.price * count;
          }
        });
        return dailyTotal;
      });

      const ctx = document.getElementById('totalAssetChart').getContext('2d');
      if (totalAssetChartInstance) totalAssetChartInstance.destroy();
      totalAssetChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: sortedDates,
          datasets: [{
            label: '総資産', data: trendData, borderColor: '#f1c40f', backgroundColor: 'rgba(241, 196, 15, 0.1)', fill: true, tension: 0.1, pointRadius: 3
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#ccc', font: { size: 9 } }, grid: { display: false } },
            y: { ticks: { color: '#ccc', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.1)' } }
          },
          onClick: (e, activeEls) => {
            if (activeEls.length > 0) {
              const dataIndex = activeEls[0].index;
              showAssetBreakdown(sortedDates[dataIndex]);
            }
          }
        }
      });
    }

    function showAssetBreakdown(targetDate) {
      const breakdownContainer = document.getElementById('asset-breakdown');
      let html = `<h4 style="margin-top:0; border-bottom: 2px solid #f1c40f; padding-bottom: 5px;">📅 ${targetDate} 時点の内訳</h4>`;
      let totalPast = 0, totalCurrent = 0, listHtml = `<div style="display: grid; gap: 8px;">`;

      cardDataList.forEach(card => {
        const count = ownedCounts[getCardKey(card)] || 0;
        if (count > 0) {
          const activeHistory = getActiveHistory(card);
          const activePrice = getActivePrice(card);
          const priceRecord = activeHistory.filter(h => new Date(h.date) <= new Date(targetDate)).sort((a, b) => new Date(b.date) - new Date(a.date))[0];
          if (priceRecord) {
            totalPast += priceRecord.price * count;
            totalCurrent += activePrice * count;
            const diff = activePrice - priceRecord.price;
            listHtml += `<div style="background:#f9f9f9; padding:8px; border-radius:4px; display:flex; justify-content:space-between; font-size:0.85em;">
              <div><b>${card.name}</b> x${count}</div>
              <div style="text-align:right">当時 ¥${priceRecord.price.toLocaleString()} <br> 現在 ¥${activePrice.toLocaleString()} (${diff >= 0 ? '+' : ''}${diff.toLocaleString()})</div>
            </div>`;
          }
        }
      });

      const totalDiff = totalCurrent - totalPast;
      html += `<p style="font-weight:bold; font-size:0.9em; color:${totalDiff >= 0 ? '#e53935' : '#1e88e5'}">当時比: ${totalDiff >= 0 ? '+' : ''}¥${totalDiff.toLocaleString()}</p>`;
      breakdownContainer.innerHTML = html + listHtml + `</div>`;
      breakdownContainer.style.display = 'block';
    }

    function exportToCSV() {
      let csvContent = "\uFEFFカード名,型番,価格,所持枚数,小計,画像URL\n";
      let countData = 0;
      cardDataList.forEach(card => {
        const key = getCardKey(card);
        const count = ownedCounts[key] || 0;
        if (count > 0) {
          const imageId = getActiveImage(card);
          const price = getActivePrice(card);
          const imgUrl = imageId.startsWith('http') ? imageId : 'https://drive.google.com/thumbnail?id=' + imageId + '&sz=w400';
          csvContent += `"${card.name}","${card.modelNo}",${price},${count},${price * count},"${imgUrl}"\n`;
          countData++;
        }
      });
      if (countData === 0) return alert("所持カードがありません。");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `onepiece_assets_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }

    function importFromCSV(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        const lines = text.split(/\r?\n/);
        const newCounts = {};
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const cols = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
          if (cols && cols.length >= 4) {
            const name = cols[0].replace(/"/g, '').trim();
            const model = cols[1].replace(/"/g, '').trim();
            const count = parseInt(cols[3].replace(/"/g, '').trim()) || 0;
            newCounts[name + "_" + model] = count;
          }
        }
        if (Object.keys(newCounts).length > 0) {
          if (confirm(`CSVから ${Object.keys(newCounts).length} 件のデータを取り込みます。現在のデータは上書きされますがよろしいですか？`)) {
            ownedCounts = newCounts;
            migrateSavedCardState(cardDataList);
            localStorage.setItem('onepieceOwnedCounts', JSON.stringify(ownedCounts));
            refreshAssetStats();
            filterAndRender();
            alert("インポートが完了しました。");
          }
        } else {
          alert("有効なデータが見つかりませんでした。CSVの形式を確認してください。");
        }
      };
      reader.readAsText(file);
      event.target.value = ''; 
    }

    function toggleFavorite(event, key) {
      event.stopPropagation();
      const index = favorites.indexOf(key);
      if (index === -1) {
        favorites.push(key);
        event.target.classList.add('active');
      } else {
        favorites.splice(index, 1);
        event.target.classList.remove('active');
        if (document.getElementById('trendFilter').value === 'favorites') {
          event.target.closest('.card').style.display = 'none';
        }
      }
      localStorage.setItem('onepieceFavorites', JSON.stringify(favorites));
    }

    fetch(API_URL)
      .then(res => res.json())
      .then(data => initApp(data))
      .catch(err => document.getElementById('loading').innerText = 'データ取得に失敗しました。');

    function initApp(data) {
      document.getElementById('loading').style.display = 'none';
      cardDataList = data.map(normalizeCardForShops);
      migrateSavedCardState(cardDataList);
      prepareTrendData(cardDataList);
      refreshAssetStats();
      filterAndRender();
    }

    function prepareTrendData(data) {
      let latestStr = '1970/01/01';
      
      data.forEach(c => {
        const history = getActiveHistory(c);
        if (history.length) {
          const d = history[history.length-1].date;
          if (d > latestStr) latestStr = d;
        }
      });
      const globalLatestDate = new Date(latestStr);

      data.forEach(c => {
        c.trendPercent = 0; c.trendDiff = 0; c.weeklyDiff = 0; c.weeklyPercent = 0;
        const history = getActiveHistory(c);
        const p = history.map(h => h.price);
        c.activePrice = getActivePrice(c);
        c.minPrice = p.length ? Math.min(...p) : 0;
        c.maxPrice = p.length ? Math.max(...p) : 0;
        
        if (history.length > 0) {
          const last = history[history.length-1];
          if (last.date === latestStr && history.length >= 2) {
            const prev = history[history.length-2];
            c.trendDiff = last.price - prev.price;
            if(prev.price > 0) c.trendPercent = (c.trendDiff / prev.price) * 100;
          }
          
          const targetDate = new Date(globalLatestDate);
          targetDate.setDate(globalLatestDate.getDate() - 7);
          const hasWeekly = history.some(h => new Date(h.date) > targetDate);
          
          if (hasWeekly && history.length >= 2) {
            let weekAgo = history.slice().reverse().find(h => new Date(h.date) <= targetDate);
            if (!weekAgo) weekAgo = history[0];
            c.weeklyDiff = c.activePrice - weekAgo.price;
            if(weekAgo.price > 0) c.weeklyPercent = (c.weeklyDiff / weekAgo.price) * 100;
          }
        }
      });
    }

    function setSeries(series, btn) {
      currentSeries = series;
      renderLimit = 300;
      document.querySelectorAll('.series-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterAndRender();
    }

    function loadMoreCards() {
      renderLimit += 300;
      filterAndRender();
    }

    function filterAndRender() {
      const grid = document.getElementById('grid'), noData = document.getElementById('no-data-msg'), loadMore = document.getElementById('load-more');
      grid.innerHTML = '';
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('trendFilter').value;
      const sort = document.getElementById('sortOrder').value;

      let filtered = cardDataList.filter(c => {
        const key = getCardKey(c);
        const activePrice = getActivePrice(c);
        const matchText = c.name.toLowerCase().includes(search) || c.modelNo.toLowerCase().includes(search);
        let matchFilter = true;
        
        if (filter === 'favorites') matchFilter = favorites.includes(key);
        else if (filter === 'owned') matchFilter = (ownedCounts[key] || 0) > 0;
        else if (filter === 'allTimeHigh') matchFilter = activePrice > 0 && activePrice >= c.maxPrice;
        else if (filter === 'surge') matchFilter = c.trendPercent >= 5;
        else if (filter === 'crash') matchFilter = c.trendPercent <= -5;
        else if (filter === 'high') matchFilter = activePrice >= 100000;
        else if (filter === 'dailyUp') matchFilter = c.trendDiff > 0;
        else if (filter === 'dailyDown') matchFilter = c.trendDiff < 0;
        else if (filter === 'weeklyUp') matchFilter = c.weeklyDiff > 0;
        else if (filter === 'weeklyDown') matchFilter = c.weeklyDiff < 0;
        
        return activePrice > 0 && matchText && matchFilter && (currentSeries === 'all' || c.modelNo.toUpperCase().includes(currentSeries));
      });

      filtered.sort((a, b) => {
        if (sort === 'priceDesc') return getActivePrice(b) - getActivePrice(a);
        if (sort === 'priceAsc') return getActivePrice(a) - getActivePrice(b);
        if (sort === 'trendDesc') return b.trendDiff - a.trendDiff;
        if (sort === 'trendAsc') return a.trendDiff - b.trendDiff;
        if (sort === 'weeklyDesc') return b.weeklyDiff - a.weeklyDiff;
        if (sort === 'weeklyAsc') return a.weeklyDiff - b.weeklyDiff;
        return a.modelNo.localeCompare(b.modelNo);
      });

      if (!filtered.length) { noData.style.display = 'block'; loadMore.style.display = 'none'; return; }
      noData.style.display = 'none';
      loadMore.style.display = filtered.length > renderLimit ? 'block' : 'none';

      filtered.slice(0, renderLimit).forEach(c => {
        const key = getCardKey(c);
        const shopData = getShopData(c);
        const activePrice = getActivePrice(c);
        const shopCompareHtml = Object.entries(c.pricesByShop || {})
          .sort((a, b) => b[1].latestPrice - a[1].latestPrice)
          .map(([, shop]) => `<div><span>${shop.shopName}</span><b>¥${Number(shop.latestPrice || 0).toLocaleString()}</b></div>`)
          .join('');
        
        // 1. 大枠のdivを作成
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => openModal(c);
        
        // 2. 星ボタンを作成（DOMとして独立させる）
        const star = document.createElement('div');
        star.className = 'star-btn ' + (favorites.includes(key) ? 'active' : '');
        star.innerHTML = '★';
        star.onclick = (e) => toggleFavorite(e, key);

        // 3. 画像を作成（★ここで no-referrer を設定）
        const img = document.createElement('img');
        img.setAttribute('loading', 'lazy');
        img.setAttribute('referrerpolicy', 'no-referrer');
        const imageId = getActiveImage(c);
        img.src = imageId.startsWith('http') ? imageId : 'https://drive.google.com/thumbnail?id=' + imageId + '&sz=w400';
        
        // 4. 情報部分のdivを作成（innerHTML += によるバグを防ぐ）
        const infoDiv = document.createElement('div');
        infoDiv.innerHTML = `
          <div style="font-size:0.9em; font-weight:bold;">${c.name}</div>
          <div style="font-size:0.7em; color:gray; margin-bottom:5px;">${c.modelNo}</div>
          <div class="shop-badge">${currentShop === 'best' ? '最高買取: ' : ''}${shopData?.shopName || ''}</div>
          <div class="price-main">¥${activePrice.toLocaleString()}</div>
          <div class="shop-compare">${shopCompareHtml}</div>
          
          <div class="trend-container">
            <div class="trend ${c.trendDiff>0?'up':c.trendDiff<0?'down':'flat'}">
              <span class="label">前日比:</span> 
              <span>${c.trendDiff>0?'▲ +¥'+c.trendDiff.toLocaleString():c.trendDiff<0?'▼ ¥'+Math.abs(c.trendDiff).toLocaleString():'▶ 変動なし'}</span>
            </div>
            <div class="trend ${c.weeklyDiff>0?'up':c.weeklyDiff<0?'down':'flat'}">
              <span class="label">週間比:</span> 
              <span>${c.weeklyDiff>0?'▲ +¥'+c.weeklyDiff.toLocaleString():c.weeklyDiff<0?'▼ ¥'+Math.abs(c.weeklyDiff).toLocaleString():'▶ 変動なし'}</span>
            </div>
          </div>
          
          <div class="price-range">
            <div>最安 <span class="price-min">¥${c.minPrice.toLocaleString()}</span></div>
            <div>最高 <span class="price-max">¥${c.maxPrice.toLocaleString()}</span></div>
          </div>
          
          <div class="inventory-control">
            <label style="font-size:0.75em">枚数:</label>
            <input type="number" class="inventory-input" value="${ownedCounts[key]||0}" min="0" onclick="event.stopPropagation()" onchange="updateInventory(event, '${key}')">
          </div>
        `;
        
        // 5. 全てを安全に合体させる
        div.appendChild(star); 
        div.appendChild(img); 
        div.appendChild(infoDiv);
        
        grid.appendChild(div);
      });
    }

    function openModal(c) {
      const history = getActiveHistory(c);
      const shopData = getShopData(c);
      document.getElementById('modal-title').textContent = `${c.name} / ${shopData?.shopName || ''}`;
      document.getElementById('modal').style.display = 'flex';
      const ctx = document.getElementById('priceChart').getContext('2d');
      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: history.map(h => h.date),
          datasets: [{ label: '買取価格 (円)', data: history.map(h => h.price), borderColor: '#007bff', backgroundColor: 'rgba(0, 123, 255, 0.1)', fill: true, tension: 0.1 }]
        }
      });
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
  </script>
</body>
</html>
