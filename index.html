<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワンピカード 資産管理</title>
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="apple-touch-icon" href="icons/app-icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icons/app-icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2c3e50">
  <meta name="application-version" content="2.2.0">
  <meta name="apple-mobile-web-app-title" content="ワンピ資産">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="vendor/chart.min.js"></script>
  <script src="search-utils.js"></script>
  <script src="pwa-update.js" defer></script>
  <style>
    body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; margin: 0; }
    
    #asset-summary { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .asset-info-row { display: flex; gap: 20px; align-items: center; justify-content: space-around; flex-wrap: wrap;}
    .asset-item { text-align: center; }
    .asset-label { font-size: 0.8em; opacity: 0.8; }
    .asset-value { font-size: 1.5em; font-weight: bold; color: #f1c40f; }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .btn-export { background-color: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; }
    .btn-import { background-color: #2980b9; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; }
    .btn-db-import { background-color: #6c4bb6; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; }

    #total-asset-chart-container { background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 6px; height: 180px; width: 100%; cursor: pointer;}
    #asset-breakdown { display: none; background: #fff; color: #333; margin-top: 10px; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-height: 250px; overflow-y: auto; font-size: 0.9em;}

    #controls { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    #controls input, #controls select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }
    #controls select { flex: 1; min-width: 150px; }
    .search-field { flex: 2 1 320px; min-width: min(100%, 260px); position: relative; }
    .search-field input { width: 100%; box-sizing: border-box; padding-right: 38px !important; }
    .clear-search-btn { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: #777; cursor: pointer; font-size: 20px; line-height: 1; display: none; }
    .clear-search-btn:hover { background: #edf0f3; color: #222; }
    .fuzzy-toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 8px; border: 1px solid #ccd2d8; border-radius: 4px; background: #f8f9fb; white-space: nowrap; cursor: pointer; font-size: 0.88em; }
    .fuzzy-toggle input { margin: 0; }
    .detail-filter-btn { min-height: 38px; padding: 8px 12px; border: 1px solid #007bff; border-radius: 4px; background: #fff; color: #0069d9; cursor: pointer; font-weight: bold; white-space: nowrap; }
    .detail-filter-btn:hover { background: #eef6ff; }
    .filter-count { display: none; min-width: 19px; height: 19px; margin-left: 4px; border-radius: 10px; background: #007bff; color: #fff; align-items: center; justify-content: center; font-size: 0.75em; }
    #filter-summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 28px; margin: 0 0 10px; color: #5b6570; font-size: 0.86em; }
    #result-count { font-weight: bold; color: #34495e; }
    .filter-chip { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 12px; background: #e8f3ff; color: #075a9c; }
    
    #series-filters { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 20px; }
    .series-btn { padding: 6px 12px; border: 1px solid #ccc; border-radius: 20px; background: white; cursor: pointer; font-size: 0.8em; transition: 0.2s; }
    .series-btn.active { background: #007bff; color: white; border-color: #007bff; font-weight: bold; }
    
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 8px; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; text-align: center; transition: 0.2s; display: flex; flex-direction: column; position: relative;}
    .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    .card img { max-width: 100%; height: auto; border-radius: 4px; margin-bottom: 8px; }
    
    .price-main { font-weight: bold; color: #d9534f; font-size: 1.4em; margin: 5px 0; }
    .shop-badge { display: inline-block; font-size: 0.72em; color: #fff; background: #34495e; border-radius: 4px; padding: 3px 7px; margin-bottom: 4px; }
    .shop-compare { font-size: 0.75em; color: #555; background: #f8f9fb; border: 1px solid #e0e4e8; border-radius: 4px; padding: 6px; margin: 6px 0; text-align: left; }
    .shop-compare div { display: flex; justify-content: space-between; gap: 8px; }
    #load-more { display: none; margin: 24px auto 0; padding: 10px 18px; border: none; border-radius: 4px; background: #2c3e50; color: #fff; font-weight: bold; cursor: pointer; }
    .inventory-control { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #eee; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .inventory-input { width: 50px; padding: 4px; border: 1px solid #ddd; border-radius: 4px; text-align: center; font-weight: bold; }

    .trend-container { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
    .trend { font-size: 0.75em; font-weight: bold; padding: 4px; border-radius: 4px; background: #f9f9f9; text-align: left; display: flex; justify-content: space-between;}
    .trend span.label { color: #555; }
    .trend.up { background: #ffebee; color: #e53935; }
    .trend.down { background: #e3f2fd; color: #1e88e5; }
    .trend.flat { color: #9e9e9e; }
    
    .price-range { display: flex; justify-content: space-around; font-size: 0.75em; color: #666; background: #f0f2f5; padding: 6px; border-radius: 4px; margin-top: auto; border: 1px solid #e0e4e8; }
    .price-min { color: #1e88e5; font-weight: bold; }
    .price-max { color: #d32f2f; font-weight: bold; }

    .pwa-update-toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3000; width: min(92vw, 560px); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid #9bb8d1; border-radius: 10px; background: #f4f9fd; color: #19364f; box-shadow: 0 8px 28px rgba(0,0,0,.22); }
    .pwa-update-toast[hidden] { display: none; }
    .pwa-update-message { line-height: 1.45; font-size: .9em; }
    .pwa-update-message strong { display: block; font-size: 1em; }
    .pwa-update-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .pwa-update-actions button { border: 0; border-radius: 5px; padding: 8px 11px; font-weight: bold; cursor: pointer; }
    #pwa-update-apply { background: #1769aa; color: #fff; }
    #pwa-update-dismiss { background: #e3eaf0; color: #34495e; }

    .star-btn { position: absolute; top: 10px; right: 10px; font-size: 24px; color: #ccc; cursor: pointer; text-shadow: 0 0 2px rgba(0,0,0,0.3); z-index: 10; transition: transform 0.1s;}
    .star-btn:hover { transform: scale(1.2); }
    .star-btn.active { color: #ffd700; text-shadow: 0 0 5px rgba(255, 215, 0, 0.8); }

    #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
    #modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 600px; position: relative; }
    #close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 24px; color: #666; }
    #loading { text-align: center; color: #666; padding: 50px; font-weight: bold; }

    #filter-modal { display: none; position: fixed; inset: 0; z-index: 1100; padding: 20px; background: rgba(18, 28, 38, 0.7); align-items: center; justify-content: center; box-sizing: border-box; }
    .filter-dialog { width: min(820px, 100%); max-height: min(90vh, 900px); display: flex; flex-direction: column; background: #fff; border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,0.3); overflow: hidden; }
    .filter-dialog-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #e4e7eb; }
    .filter-dialog-header h2 { margin: 0; font-size: 1.15em; }
    .filter-close-btn { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: #555; cursor: pointer; font-size: 26px; line-height: 1; }
    .filter-close-btn:hover { background: #eef0f2; }
    #filter-options { overflow-y: auto; overscroll-behavior: contain; padding: 18px 20px; }
    .filter-group { margin: 0 0 18px; padding: 12px; border: 1px solid #dce1e6; border-radius: 8px; }
    .filter-group legend { padding: 0 6px; font-weight: bold; color: #34495e; }
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
    .filter-grid.wide { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .filter-option { display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 5px 8px; border: 1px solid #d7dce1; border-radius: 6px; background: #fafbfc; cursor: pointer; box-sizing: border-box; }
    .filter-option:hover { border-color: #7eb9ef; background: #f2f8ff; }
    .filter-option input { margin: 0; }
    .filter-select { width: 100%; padding: 9px; border: 1px solid #c7ced5; border-radius: 5px; background: #fff; font-size: 1em; }
    .price-filter-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
    .price-filter-row input { min-width: 0; padding: 9px; border: 1px solid #c7ced5; border-radius: 5px; font-size: 1em; }
    .filter-dialog-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid #e4e7eb; background: #fafbfc; }
    .filter-dialog-footer button { padding: 9px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .filter-reset-btn { border: 1px solid #aeb7c0; background: #fff; color: #4c5965; }
    .filter-apply-btn { border: 1px solid #007bff; background: #007bff; color: #fff; }

    #db-import-modal { display: none; position: fixed; inset: 0; z-index: 1300; padding: 20px; background: rgba(18, 28, 38, 0.72); align-items: center; justify-content: center; box-sizing: border-box; }
    .db-import-dialog { width: min(900px, 100%); max-height: min(92vh, 920px); display: flex; flex-direction: column; background: #fff; border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,0.35); overflow: hidden; }
    .db-import-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 16px 20px; border-bottom: 1px solid #e4e7eb; }
    .db-import-header h2 { margin: 0 0 4px; font-size: 1.15em; }
    .db-import-header p { margin: 0; color: #667085; font-size: .84em; }
    .db-import-body { overflow-y: auto; padding: 18px 20px; }
    .db-import-stats { display: grid; grid-template-columns: repeat(5, minmax(105px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .db-import-stat { padding: 10px; border: 1px solid #dce1e6; border-radius: 7px; background: #f8fafc; text-align: center; }
    .db-import-stat strong { display: block; color: #25364a; font-size: 1.25em; }
    .db-import-stat span { color: #667085; font-size: .78em; }
    .db-import-mode { display: grid; gap: 8px; margin: 0 0 14px; padding: 12px; border: 1px solid #dce1e6; border-radius: 8px; }
    .db-import-mode legend { padding: 0 6px; font-weight: bold; color: #34495e; }
    .db-import-mode label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
    .db-import-mode small { display: block; margin-top: 2px; color: #667085; }
    .db-import-notice { margin: 0 0 14px; padding: 10px 12px; border: 1px solid #e7c66b; border-radius: 7px; background: #fff8e1; color: #6b5312; line-height: 1.5; font-size: .88em; }
    #db-import-unresolved { display: grid; gap: 7px; max-height: 260px; overflow-y: auto; }
    .db-import-unresolved-item { padding: 8px 10px; border: 1px solid #e0e4e8; border-radius: 6px; background: #fafbfc; font-size: .84em; }
    .db-import-unresolved-item strong { display: block; margin-bottom: 3px; }
    .db-import-unresolved-item span { color: #667085; }
    .db-import-footer { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid #e4e7eb; background: #fafbfc; }
    .db-import-footer button { padding: 9px 13px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .db-import-download { border: 1px solid #8995a3; background: #fff; color: #34495e; }
    .db-import-download:disabled { opacity: .45; cursor: not-allowed; }
    .db-import-cancel { border: 1px solid #aeb7c0; background: #fff; color: #4c5965; }
    .db-import-apply { border: 1px solid #6c4bb6; background: #6c4bb6; color: #fff; }
    .db-import-apply:disabled { opacity: .45; cursor: not-allowed; }

    @media (max-width: 640px) {
      body { padding: 10px; }
      #controls { padding: 10px; }
      #controls select { min-width: calc(50% - 5px); }
      .search-field { flex-basis: 100%; }
      #filter-modal { padding: 0; align-items: flex-end; }
      .filter-dialog { max-height: 94vh; border-radius: 12px 12px 0 0; }
      .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filter-dialog-footer button { flex: 1; }
      #db-import-modal { padding: 0; align-items: flex-end; }
      .db-import-dialog { max-height: 96vh; border-radius: 12px 12px 0 0; }
      .db-import-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .db-import-footer button { flex: 1 1 calc(50% - 8px); }
    }
    /* renderCards / 資産内訳で使うクラス (インライン style を CSP 向けに整理) */
    .card-name { font-size: 0.9em; font-weight: bold; }
    .card-model { font-size: 0.7em; color: gray; margin-bottom: 5px; }
    .inventory-label { font-size: 0.75em; }
    .stale-note { color: #c00; }
    .breakdown-heading { margin-top: 0; border-bottom: 2px solid #f1c40f; padding-bottom: 5px; }
    .breakdown-list { display: grid; gap: 8px; }
    .breakdown-row { background: #f9f9f9; padding: 8px; border-radius: 4px; display: flex; justify-content: space-between; font-size: 0.85em; }
    .breakdown-amounts { text-align: right; }
    .breakdown-total { font-weight: bold; font-size: 0.9em; }
    .breakdown-total.up { color: #e53935; }
    .breakdown-total.down { color: #1e88e5; }
  </style>
</head>
<body>

  <div id="pwa-update-toast" class="pwa-update-toast" role="status" aria-live="polite" hidden>
    <div class="pwa-update-message">
      <strong>新しいバージョンがあります</strong>
      <span>更新すると最新の検索機能と価格データを利用できます。</span>
    </div>
    <div class="pwa-update-actions">
      <button type="button" id="pwa-update-dismiss">後で</button>
      <button type="button" id="pwa-update-apply">更新</button>
    </div>
  </div>

  <div id="asset-summary">
    <div class="asset-info-row">
      <div class="asset-item">
        <div class="asset-label">合計枚数</div>
        <div id="total-count" class="asset-value">0 枚</div>
      </div>
      <div class="asset-item">
        <div class="asset-label">推定資産総額</div>
        <div id="total-assets" class="asset-value">¥0</div>
      </div>
      <div class="btn-group">
        <button class="btn-export" data-action="export-csv">CSV保存</button>
        <button class="btn-import" data-action="open-csv-input">CSV読込</button>
        <input type="file" id="csvInput" style="display:none" accept=".csv" data-action="import-csv">
        <button class="btn-db-import" data-action="open-db-input">DB所持JSON読込</button>
        <input type="file" id="dbCollectionInput" style="display:none" accept=".json,application/json" data-action="import-db-json">
      </div>
    </div>
    <div id="total-asset-chart-container">
      <canvas id="totalAssetChart"></canvas>
    </div>
    <div id="asset-breakdown"></div>
  </div>
  
  <div id="controls">
    <div class="search-field">
      <input type="search" id="searchInput" placeholder="名前・型番・特徴・効果を検索..." autocomplete="off" aria-label="カード検索">
      <button type="button" id="clearSearchBtn" class="clear-search-btn" aria-label="検索をクリア">×</button>
    </div>
    <select id="searchMode" aria-label="キーワード検索モード">
      <option value="AND">AND（すべて含む）</option>
      <option value="OR">OR（いずれか）</option>
    </select>
    <label class="fuzzy-toggle" title="かな・全半角の表記ゆれと軽微なタイプミスを許容します">
      <input type="checkbox" id="fuzzySearch" checked>
      あいまい検索
    </label>
    <button type="button" id="openFilterBtn" class="detail-filter-btn" aria-haspopup="dialog" aria-controls="filter-modal">
      詳細フィルタ<span id="filterCount" class="filter-count">0</span>
    </button>
    <select id="shopFilter" data-action="set-shop">
      <option value="best">ショップ最高買取</option>
      <option value="mercard">メルカード</option>
      <option value="cardrush">カードラッシュ</option>
      <option value="torecard">トレカード秋葉原</option>
      <option value="unmerged">マージなし（出品別）</option>
    </select>
    <select id="trendFilter" data-action="rerender">
      <option value="all">すべてのカード</option>
      <option value="owned">📦 所持カードのみ</option>
      <option value="favorites">⭐ お気に入りのみ</option>
      <option value="allTimeHigh">👑 過去最高額を更新中</option>
      <option value="dailyUp">📈 前日から上がったカード</option>
      <option value="dailyDown">📉 前日から下がったカード</option>
      <option value="weeklyUp">📅 1週間で上がったカード</option>
      <option value="weeklyDown">📅 1週間で下がったカード</option>
      <option value="surge">🔥 爆益中 (+5%以上)</option>
      <option value="crash">🥶 暴落中 (-5%以下)</option>
      <option value="high">💎 10万円以上の高額</option>
    </select>
    <select id="sortOrder" data-action="rerender">
      <option value="priceDesc">高い順（価格）</option>
      <option value="priceAsc">安い順（価格）</option>
      <option value="trendDesc">↑ 前日からの値上がり額順</option>
      <option value="trendAsc">↓ 前日からの値下がり額順</option>
      <option value="weeklyDesc">↑ 1週間の値上がり額順</option>
      <option value="weeklyAsc">↓ 1週間の値下がり額順</option>
      <option value="modelAsc">型番順 (OP01〜)</option>
    </select>
  </div>

  <div id="filter-summary" aria-live="polite">
    <span id="result-count">0件</span>
    <span>スペース区切りで複数語、先頭に「-」で除外できます。</span>
    <span id="active-filter-chips"></span>
  </div>

  <div id="series-filters">
    <button class="series-btn active" data-action="set-series" data-series="all">すべて</button>
    <button class="series-btn" data-action="set-series" data-series="OP">通常弾(OP)</button>
    <button class="series-btn" data-action="set-series" data-series="EB">エクストラ(EB)</button>
    <button class="series-btn" data-action="set-series" data-series="ST">スタート(ST)</button>
    <button class="series-btn" data-action="set-series" data-series="P-">プロモ</button>
  </div>

  <div id="loading">データを読み込んでいます...</div>
  <div id="no-data-msg" style="display: none; text-align: center; color: gray; padding: 50px;">該当するカードがありません。</div>
  <div id="grid"></div>
  <button id="load-more" data-action="load-more">もっと表示</button>

  <div id="modal">
    <div id="modal-content">
      <span id="close-btn" data-action="close-modal" role="button" tabindex="0">×</span>
      <h3 id="modal-title"></h3>
      <canvas id="priceChart"></canvas>
    </div>
  </div>

  <div id="filter-modal" role="dialog" aria-modal="true" aria-labelledby="filter-modal-title">
    <div class="filter-dialog">
      <div class="filter-dialog-header">
        <h2 id="filter-modal-title">詳細フィルタ</h2>
        <button type="button" id="closeFilterBtn" class="filter-close-btn" aria-label="詳細フィルタを閉じる">×</button>
      </div>
      <div id="filter-options"></div>
      <div class="filter-dialog-footer">
        <button type="button" id="resetFilterBtn" class="filter-reset-btn">リセット</button>
        <button type="button" id="applyFilterBtn" class="filter-apply-btn">適用</button>
      </div>
    </div>
  </div>

  <div id="db-import-modal" role="presentation" aria-hidden="true">
    <section class="db-import-dialog" role="dialog" aria-modal="true" aria-labelledby="db-import-title">
      <header class="db-import-header">
        <div>
          <h2 id="db-import-title">DB所持JSON インポート確認</h2>
          <p id="db-import-source">ファイルを照合しています。</p>
        </div>
        <button type="button" class="filter-close-btn" data-action="cancel-db-import" aria-label="キャンセル">×</button>
      </header>
      <div class="db-import-body">
        <div class="db-import-stats">
          <div class="db-import-stat"><strong id="db-import-total-cards">0</strong><span>総枚数</span></div>
          <div class="db-import-stat"><strong id="db-import-total-kinds">0</strong><span>種類数</span></div>
          <div class="db-import-stat"><strong id="db-import-matched">0</strong><span>一致</span></div>
          <div class="db-import-stat"><strong id="db-import-ambiguous">0</strong><span>候補複数</span></div>
          <div class="db-import-stat"><strong id="db-import-unmatched-count">0</strong><span>未一致</span></div>
        </div>
        <fieldset class="db-import-mode">
          <legend>反映方法</legend>
          <label>
            <input type="radio" name="dbImportMode" value="replace-matched" checked>
            <span><strong>一致分のみ置き換え（推奨）</strong><small>一致したカードだけDBの枚数へ更新し、それ以外の既存所持数は残します。</small></span>
          </label>
          <label>
            <input type="radio" name="dbImportMode" value="add">
            <span><strong>一致分を加算</strong><small>一致したDB所持数を、現在の枚数へ足します。</small></span>
          </label>
        </fieldset>
        <p class="db-import-notice" id="db-import-notice">未一致カードは反映せず、この画面から保存できます。</p>
        <div id="db-import-unresolved"></div>
      </div>
      <footer class="db-import-footer">
        <button type="button" id="db-import-save-json" class="db-import-download" data-action="save-db-unmatched" data-format="json">未一致をJSON保存</button>
        <button type="button" id="db-import-save-csv" class="db-import-download" data-action="save-db-unmatched" data-format="csv">未一致をCSV保存</button>
        <button type="button" class="db-import-cancel" data-action="cancel-db-import">キャンセル</button>
        <button type="button" id="db-import-apply" class="db-import-apply" data-action="apply-db-import">一致分を反映</button>
      </footer>
    </section>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
